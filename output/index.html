<style>
:root{--paper:#f3f1eb;--ink:#172d2b;--muted:#506763;--green:#146b59;--mint:#c9e0d5;--line:#dedfd6;--cream:#f9f7f1;--gold:#c17a48}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid #c17a48;outline-offset:3px}h1,h2,h3,p{margin:0}header{background:#152d2b;color:#f9f7f1;background-image:radial-gradient(ellipse at 92% 30%,#28524a,transparent 55%)}.wrap{width:min(1320px,calc(100% - 80px));margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid #52716b;gap:16px}.brand-name{display:flex;align-items:center;gap:13px;font-weight:650}.mark{display:grid;place-items:center;width:46px;height:36px;border:1px solid #94b5aa;border-radius:7px;font:700 17px Georgia;letter-spacing:-.5px}.profile,.summary,.hero p{color:#d0e2db}.profile{text-align:right;font-size:13px}.hero{padding:35px 0 28px}.hero h1{font:normal clamp(36px,5vw,69px)/1.03 Georgia,serif;letter-spacing:-.045em;margin-bottom:12px}.hero p{font-size:14px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;border-radius:9px 9px 0 0;padding:12px 17px;background:transparent;color:#cfe1db;text-align:left}.nav button[aria-current=page]{color:var(--ink);background:var(--paper);font-weight:700}.nav button:hover:not([aria-current]){background:#2c4d47}.heading{display:flex;gap:20px;justify-content:space-between;align-items:end;padding:28px 0 17px}.heading h2{font:normal clamp(28px,3vw,41px)/1.1 Georgia;letter-spacing:-.035em}.heading p{color:var(--muted);font-size:13px;margin-top:5px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filter{display:grid;gap:4px;font-size:12px;font-weight:650;color:var(--muted)}select,.reset{border:1px solid #cbd1c7;border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;font-size:13px;min-height:38px}.reset{background:transparent}.reset:hover{background:#e4ebe2}.cards,.grid,.flow{display:grid;gap:14px;margin-bottom:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(184px,1fr))}.grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.panel,.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 16px #18342e08;padding:20px 22px;min-width:0}.card{border-top:3px solid #9dbeb0}.card.accent{background:#e2eee7;border-top-color:var(--green)}.card-label{color:var(--muted);font-size:13px;font-weight:650}.value{font:normal clamp(28px,3vw,42px)/1.1 Georgia;letter-spacing:-.045em;margin:7px 0}.note,.card small,.empty{color:var(--muted);font-size:12px}.panel h3{font:normal 24px/1.15 Georgia;letter-spacing:-.025em;margin-bottom:7px}.panel-header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.flow{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}.step{background:#edf3ee;padding:10px;border-radius:8px;line-height:1.3;font-size:12px;min-width:0}.step b{display:block;margin-bottom:3px}.entries{list-style:none;margin:8px 0 0;padding:0}.entries li,.coverage-row{border-top:1px solid #e8ebe5;padding:8px 0}.entries b,.coverage-row b{font-weight:650}.coverage-row{display:grid;grid-template-columns:minmax(105px,1fr) 2fr;gap:12px;font-size:13px}.coverage-row span{color:var(--muted)}.coverage-list{max-height:245px;overflow:auto;padding-right:9px}.evidence{border-left:3px solid var(--gold);padding:0 0 0 13px;margin-top:16px}.evidence p+p{margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chips span{background:#eef3ee;padding:5px 9px;border-radius:6px;font-size:12px}.chart{margin-top:17px;display:grid;gap:11px}.chart-row{display:grid;grid-template-columns:minmax(98px,124px) 1fr;align-items:center;gap:12px;font-size:13px}.chart-track{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:10px}.chart svg{display:block;width:100%;height:24px;overflow:visible}.chart rect[data-tip]{cursor:help}.chart rect[data-tip]:hover,.chart rect[data-tip]:focus{filter:brightness(1.18);stroke:#172d2b;stroke-width:2;vector-effect:non-scaling-stroke}.chart-track strong{text-align:right;font-size:13px}.tooltip{position:fixed;z-index:5;border-radius:8px;background:#152d2b;color:white;padding:9px 12px;font-size:13px;pointer-events:none;max-width:min(300px,85vw);box-shadow:0 4px 20px #0003}.model{background:#e5efe8;border-color:#cbded2}.slider-label{display:flex;justify-content:space-between;gap:10px;font-weight:650;margin-top:16px}.model input{width:100%;margin:7px 0;accent-color:var(--green);cursor:pointer}.results{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.results div{border:1px solid #cadbd0;border-radius:9px;background:#f7faf6;padding:9px 12px;font-size:13px}.results strong{display:block;font:normal 29px Georgia}.handover{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:14px 0}.handover div{border-top:1px solid var(--line);padding-top:9px;font-size:13px}.handover b{display:block;margin-bottom:3px}footer{padding:18px 0 26px;border-top:1px solid #d4d9cf;color:var(--muted);font-size:12px;margin-top:22px}footer b{display:block;color:var(--ink);margin-bottom:4px}
@media(max-width:850px){.wrap{width:calc(100% - 36px)}.heading{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}}
@media(max-width:510px){.wrap{width:calc(100% - 24px)}.brand{align-items:start}.brand-name{font-size:12px}.profile{font-size:11px}.hero{padding:25px 0 18px}.nav{gap:2px}.nav button{flex:1;font-size:12px;padding:8px}.cards{grid-template-columns:1fr}.panel,.card{padding:15px 14px}.flow{grid-template-columns:1fr 1fr}.handover{grid-template-columns:1fr}.chart-row{grid-template-columns:79px 1fr;gap:6px}.chart-track{grid-template-columns:1fr 52px;gap:4px}.coverage-row{grid-template-columns:1fr 1.5fr}}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="brand"><div class="brand-name"><span class="mark" aria-hidden="true">360</span>360 International Trading</div><div class="profile">Zoey Chao · Logistics Officer<br>May–Nov 2026</div></div>
<div class="hero"><h1>Order Fulfilment Analytics</h1><p>Operations evidence, logistics coverage and automation impact</p></div>
<nav class="nav" aria-label="Dashboard pages">
<button data-page="operations">Operations Overview</button>
<button data-page="logistics">Logistics Deep Dive</button>
<button data-page="business">Business Analysis</button>
</nav>
</div>
</header>
<main class="wrap">
<section class="heading" aria-labelledby="page-title">
<div><h2 id="page-title"></h2><p id="page-summary"></p></div>
<div class="filters">
<label class="filter">Example channel<select id="channel"><option value="">All channels</option></select></label>
<button class="reset" id="reset">Reset filters</button>
</div>
</section>
<div id="content"></div>
<footer id="sources"></footer>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script type="application/json" id="data">{"exceptions": [{"ExceptionID": "E1", "Channel": "Unspecified", "Example": "Quantity correction", "OriginalQty": "10", "CorrectedQty": "6", "ReturnedCartons": "", "ReturnCost": "", "Detail": "Order quantity corrected from 10 to 6 units.", "Source": "real examples from Zoey's chats, Nov 2026"}, {"ExceptionID": "E2", "Channel": "Costco portal", "Example": "Cancelled Costco order", "OriginalQty": "", "CorrectedQty": "", "ReturnedCartons": "", "ReturnCost": "", "Detail": "Voided in Cin7 to release stock for H60.", "Source": "real examples from Zoey's chats, Nov 2026"}, {"ExceptionID": "E3", "Channel": "Unspecified", "Example": "Damaged-goods return", "OriginalQty": "", "CorrectedQty": "", "ReturnedCartons": "1", "ReturnCost": "8.6", "Detail": "360 paid the freight.", "Source": "real examples from Zoey's chats, Nov 2026"}], "channels": [{"Channel": "Costco portal"}, {"Channel": "Unspecified"}], "systems": [{"System": "Shopify", "Stage": "Order intake", "StageSort": "1", "Coverage": "Order source"}, {"System": "Client portals", "Stage": "Order intake", "StageSort": "1", "Coverage": "Order sources"}, {"System": "Costco portal", "Stage": "Order intake", "StageSort": "1", "Coverage": "Client portal"}, {"System": "Cin7", "Stage": "Processing", "StageSort": "2", "Coverage": "Validate order details and release orders for warehouse"}, {"System": "CartonCloud", "Stage": "Warehouse / 3PL", "StageSort": "3", "Coverage": "Coordinate warehouse or 3PL fulfilment"}, {"System": "EWE", "Stage": "Tracking / delivery", "StageSort": "4", "Coverage": "Tracking including WA warehouse redirect. Tracking numbers unavailable in readable chats."}, {"System": "AusPost", "Stage": "Tracking / delivery", "StageSort": "4", "Coverage": "Tracking and delivery"}, {"System": "DHL", "Stage": "Tracking / delivery", "StageSort": "4", "Coverage": "Tracking and delivery"}, {"System": "Excel", "Stage": "Analysis tools", "StageSort": "5", "Coverage": "Listed tool"}, {"System": "Power BI", "Stage": "Analysis tools", "StageSort": "5", "Coverage": "Listed tool"}, {"System": "Codex", "Stage": "AI tools", "StageSort": "6", "Coverage": "Python order-pushing automation"}, {"System": "Claude", "Stage": "AI tools", "StageSort": "6", "Coverage": "AI tool used. The skill can be adapted to SKILL.md format."}], "freight_modes": [{"Mode": "Air", "Coverage": "Air-sea freight sheet is in scope. Sheet unavailable in readable chats."}, {"Mode": "Sea", "Coverage": "Air-sea freight sheet is in scope. Sheet unavailable in readable chats."}, {"Mode": "Road", "Coverage": "Cross-state freight to WA/Perth. Melbourne dispatch was described as faster and cheaper than Brisbane."}], "order_lines": [{"LineID": "L1", "ExampleID": "O1", "SKU": "H60", "Quantity": "10", "Source": "real examples from Zoey's chats, Nov 2026"}], "carton_examples": [{"CartonID": "C1", "Dimensions": "100x150x170", "Source": "real examples from Zoey's chats, Nov 2026"}, {"CartonID": "C2", "Dimensions": "30x40x20", "Source": "real examples from Zoey's chats, Nov 2026"}], "automation_parameters": [{"EstimateFraction": "0.65", "EstimateLabel": "Zoey's revised estimate (~60–70%)", "CoverageMinPct": "0", "CoverageMaxPct": "100", "CoverageStepPct": "1", "CoverageDefaultPct": "100", "Source": "Zoey’s stated estimate in supplied brief; coverage controls are scenario assumptions."}], "orders": [{"ExampleID": "O1", "Channel": "Costco portal", "Example": "Costco PO 1991533680", "PO": "1991533680", "OrderValue": "", "ComponentA": "", "ComponentB": "", "Source": "real examples from Zoey's chats, Nov 2026"}, {"ExampleID": "O2", "Channel": "Unspecified", "Example": "Order value example", "PO": "", "OrderValue": "20000", "ComponentA": "", "ComponentB": "", "Source": "real examples from Zoey's chats, Nov 2026"}, {"ExampleID": "O3", "Channel": "Unspecified", "Example": "Split order example", "PO": "", "OrderValue": "8600", "ComponentA": "4200", "ComponentB": "4400", "Source": "real examples from Zoey's chats, Nov 2026"}]}</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#data').textContent);
const param = data.automation_parameters[0];
const evidence = data.orders[0].Source;
const content = document.querySelector('#content');
const nav = [...document.querySelectorAll('[data-page]')];
const channel = document.querySelector('#channel');
const tooltip = document.querySelector('#tooltip');
const state = {page:'operations', channel:'', system:'', tracking:'', mode:'', coverage:Number(param.CoverageDefaultPct)};
const pages = {
  operations:['Operations Overview','Order intake, release and exception handling'],
  logistics:['Logistics Deep Dive','Freight scope, tracking coverage and warehouse coordination'],
  business:['Business Analysis','Order value examples and a processing-time scenario']
};
const footerNotes = {
  operations:'The correction and cancellation have no verified link to PO 1991533680.',
  logistics:'The air-sea freight sheet and EWE tracking numbers were unavailable in the readable chats. Carton dimension units were unspecified.',
  business:'The order values are isolated examples. What-if outputs show shares of baseline processing time. Anchor · ' + param.EstimateLabel + '.'
};
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money = (value, digits=0) => '$' + Number(value).toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const percent = value => new Intl.NumberFormat('en',{style:'percent',maximumFractionDigits:1}).format(value);
const matchesChannel = row => !state.channel || row.Channel === state.channel;
const empty = '<p class="empty">No matching example under this channel filter.</p>';
const card = (label,value,detail,accent=false) => `<article class="card ${accent?'accent':''}"><p class="card-label">${esc(label)}</p><p class="value">${esc(value ?? '—')}</p><small>${esc(value == null?'Excluded by channel filter':detail)}</small></article>`;
const options = (rows,key,selected) => rows.map(row => `<option${row[key]===selected?' selected':''}>${esc(row[key])}</option>`).join('');
const slicer = (label,key,rows,column,all) => `<label class="filter">${label}<select data-filter="${key}"><option value="">${all}</option>${options(rows,column,state[key])}</select></label>`;
const coverageRows = (rows,key) => `<div class="coverage-list" tabindex="0" aria-label="Coverage details">${rows.map(row => `<div class="coverage-row"><b>${esc(row[key])}</b><span>${esc(row.Coverage)}</span></div>`).join('')}</div>`;
function bars(rows,max) {
  if (!rows.length) return empty;
  return `<div class="chart" role="group" aria-label="Example comparison chart">${rows.map(([label,value,display,detail,color='var(--green)']) => {
    const tip = esc(label + ' · ' + display + (detail ? ' · ' + detail : ''));
    return `<div class="chart-row"><span>${esc(label)}</span><div class="chart-track"><svg viewBox="0 0 100 24" preserveAspectRatio="none" role="group" aria-label="${esc(label)}"><rect width="100" height="24" rx="2" fill="#edf1ed"/><rect width="${100*Number(value)/max}" height="24" rx="2" fill="${color}" tabindex="0" aria-label="${tip}" data-tip="${tip}"/></svg><strong>${esc(display)}</strong></div></div>`;
  }).join('')}</div>`;
}
function operations() {
  const po = data.orders.find(row=>row.PO && matchesChannel(row));
  const line = po && data.order_lines.find(row=>row.ExampleID===po.ExampleID);
  const correction = data.exceptions.find(row=>row.OriginalQty && matchesChannel(row));
  const cancelled = data.exceptions.find(row=>row.ExceptionID==='E2' && matchesChannel(row));
  const stages = [...new Set(data.systems.filter(row=>Number(row.StageSort)<=4).map(row=>row.Stage))];
  const workflow = stages.map(stage=>`<div class="step"><b>${esc(stage)}</b>${esc(data.systems.filter(row=>row.Stage===stage && row.System!=='Costco portal').map(row=>row.System).join(' · '))}</div>`).join('');
  const systems = data.systems.filter(row=>!state.system || row.System===state.system);
  return `<div class="cards">${card('Costco PO units',line?.Quantity,'PO 1991533680 · H60',true)}${card('Original quantity',correction?.OriginalQty,'Units before correction')}${card('Corrected quantity',correction?.CorrectedQty,'Units after correction')}</div>
    <div class="grid"><article class="panel"><h3>Order quantity correction</h3><p class="note">${esc(evidence)}</p>${bars(correction?[['Before',correction.OriginalQty,correction.OriginalQty+' units','Original order quantity','var(--gold)'],['After',correction.CorrectedQty,correction.CorrectedQty+' units','Corrected order quantity']]:[], Number(correction?.OriginalQty || 1))}</article>
    <article class="panel"><h3>Costco order handling</h3><p class="note">${esc(evidence)}</p>
    ${line?`<div class="evidence"><p><b>PO ${esc(po.PO)}</b></p><p>${esc(line.Quantity)} units of ${esc(line.SKU)}</p></div>`:empty}
    ${cancelled?`<div class="evidence"><p><b>${esc(cancelled.Example)}</b></p><p>${esc(cancelled.Detail)}</p></div>`:''}</article></div>
    <article class="panel"><div class="panel-header"><div><h3>Order-to-delivery workflow</h3><p class="note">System roles and operating coverage</p></div>${slicer('System','system',data.systems,'System','All systems')}</div>
    <div class="flow">${workflow}</div>${coverageRows(systems,'System')}</article>`;
}
function logistics() {
  const returned = data.exceptions.find(row=>row.ReturnedCartons && matchesChannel(row));
  const tracking = data.systems.filter(row=>row.Stage==='Tracking / delivery');
  const modes = data.freight_modes.filter(row=>!state.mode || row.Mode===state.mode);
  const support = ['Costco RA','Shortages','PO errors','Cross-state transfers','Invoice reissue','Returns','LIT','Warehouse inventory allocation','Order follow-up'];
  return `<div class="cards">${card('Returned cartons',returned?.ReturnedCartons,'Damaged-goods return',true)}${card('Return cost',returned?money(returned.ReturnCost,2):null,'Total cost · 360 paid freight')}</div>
    <div class="grid"><article class="panel"><h3>Damaged-goods return</h3><p class="note">${esc(evidence)}</p>${bars(returned?[['Returned',returned.ReturnedCartons,returned.ReturnedCartons+' carton','Total cost '+money(returned.ReturnCost,2)+' · '+returned.Detail]]:[],1)}
    ${returned?`<p class="note" style="margin-top:12px">${esc(returned.Detail)}</p>`:''}</article>
    <article class="panel"><h3>Carton examples</h3><p class="note">${esc(evidence)}</p><ul class="entries">${data.carton_examples.map(row=>`<li><b>${esc(row.Dimensions)}</b></li>`).join('')}</ul></article></div>
    <div class="grid"><article class="panel"><div class="panel-header"><h3>Freight coverage</h3>${slicer('Freight mode','mode',data.freight_modes,'Mode','All modes')}</div>${coverageRows(modes,'Mode')}</article>
    <article class="panel"><div class="panel-header"><h3>Tracking &amp; delivery</h3>${slicer('System','tracking',tracking,'System','All carriers')}</div>${coverageRows(tracking.filter(row=>!state.tracking || row.System===state.tracking),'System')}</article></div>
    <article class="panel"><h3>Exception support</h3><div class="chips">${support.map(item=>`<span>${item}</span>`).join('')}</div></article>`;
}
function business() {
  const standalone = data.orders.find(row=>row.ExampleID==='O2' && matchesChannel(row));
  const split = data.orders.find(row=>row.ExampleID==='O3' && matchesChannel(row));
  const rows = [];
  if (standalone) rows.push(['Standalone order',standalone.OrderValue,money(standalone.OrderValue),'Stated value']);
  if (split) rows.push(['Split component A',split.ComponentA,money(split.ComponentA),'Split order total '+money(split.OrderValue),'var(--gold)'],
                       ['Split component B',split.ComponentB,money(split.ComponentB),'Split order total '+money(split.OrderValue),'var(--gold)']);
  return `<div class="cards">${card('Order value example',standalone?money(standalone.OrderValue):null,'Standalone order')}${card('Split order value',split?money(split.OrderValue):null,split?money(split.ComponentA)+' + '+money(split.ComponentB):'')}
    <article class="card accent"><p class="card-label">Order-processing time reduction</p><p class="value" style="font-size:clamp(22px,2.25vw,34px)">${esc(param.EstimateLabel)}</p><small>Stated by Zoey · scenario anchor</small></article></div>
    <div class="grid"><article class="panel"><h3>Order values in the chats</h3><p class="note">${esc(evidence)}</p>${bars(rows, Math.max(1, ...rows.map(row => Number(row[1]))))}</article>
    <article class="panel model"><h3>Automation coverage · What-if</h3><p class="note">Anchor · ${esc(param.EstimateLabel)}</p>
    <label class="slider-label" for="coverage">Hypothetical coverage <output id="coverage-value" for="coverage"></output></label>
    <input id="coverage" type="range" min="${param.CoverageMinPct}" max="${param.CoverageMaxPct}" step="${param.CoverageStepPct}" value="${state.coverage}">
    <div id="scenario-results" class="results" aria-live="polite"></div><div id="scenario-chart" class="chart"></div>
    <p class="note" style="margin-top:9px">Share of baseline processing time. Modelled savings = estimate × selected coverage.</p></article></div>
    <article class="panel"><h3>Automation &amp; handover</h3><p class="note">The Codex-written Python order-pushing program runs as a local Codex desktop skill on Zoey’s Mac.</p>
    <div class="handover"><div><b>Transfer the project</b>Export the full Project folder or clone via GitHub. Include SKILL.md, reference data and scripts.</div>
    <div><b>Restore and verify</b>Re-set Python packages, API keys, file paths and system permissions. Rerun the same PO test data and verify identical results.</div>
    <div><b>Account and tool portability</b>Conversation history and memory are excluded. The skill can be adapted to Claude’s SKILL.md format.</div></div>
    <p class="note">Zoey pays for her Codex membership personally, without company reimbursement.</p></article>`;
}
function updateModel() {
  hideTip();
  const slider = document.querySelector('#coverage');
  const saved = state.coverage/100 * Number(param.EstimateFraction);
  const remaining = 1 - saved;
  const savedLabel = 'Modelled time saved · '+percent(saved);
  const remainingLabel = 'Modelled time remaining · '+percent(remaining);
  document.querySelector('#coverage-value').textContent = percent(state.coverage/100);
  slider.setAttribute('aria-valuetext',percent(state.coverage/100)+' hypothetical coverage');
  document.querySelector('#scenario-results').innerHTML = `<div>Modelled time saved<strong>${percent(saved)}</strong></div><div>Modelled time remaining<strong>${percent(remaining)}</strong></div>`;
  document.querySelector('#scenario-chart').innerHTML = `<svg viewBox="0 0 100 24" preserveAspectRatio="none" role="group" aria-label="What-if shares of baseline time">${saved>0?`<rect width="${100*saved}" height="24" fill="#146b59" tabindex="0" aria-label="${savedLabel}" data-tip="${savedLabel}"/>`:''}<rect x="${100*saved}" width="${100*remaining}" height="24" fill="#91b6a6" tabindex="0" aria-label="${remainingLabel}" data-tip="${remainingLabel}"/></svg>`;
}
function render() {
  hideTip();
  const [title,summary] = pages[state.page];
  document.querySelector('#page-title').textContent = title;
  document.querySelector('#page-summary').textContent = summary;
  for (const button of nav) {
    if (button.dataset.page===state.page) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
  content.innerHTML = ({operations,logistics,business})[state.page]();
  document.querySelector('#sources').innerHTML = `<b>Sources &amp; notes</b><p>Zoey Chao’s ChatGPT/Codex chats as supplied, read 24 Nov 2026 · ${esc(evidence)}.</p><p>Total order volumes, error rates and measured minutes per order are unavailable. ${esc(footerNotes[state.page])}</p>`;
  if (state.page==='business') updateModel();
}
function hideTip() {tooltip.hidden=true;}
function showTip(mark,x,y) {
  tooltip.textContent = mark.dataset.tip;
  tooltip.hidden=false;
  tooltip.style.left = Math.max(8,Math.min(x+12,window.innerWidth-tooltip.offsetWidth-8))+'px';
  tooltip.style.top = Math.max(8,Math.min(y+12,window.innerHeight-tooltip.offsetHeight-8))+'px';
}
channel.insertAdjacentHTML('beforeend',options(data.channels,'Channel',''));
channel.addEventListener('change',()=>{state.channel=channel.value;render();});
for (const button of nav) button.addEventListener('click',()=>{state.page=button.dataset.page;render();});
document.querySelector('#reset').addEventListener('click',()=>{
  Object.assign(state,{channel:'',system:'',tracking:'',mode:'',coverage:Number(param.CoverageDefaultPct)});
  channel.value='';
  render();
});
content.addEventListener('change',event=>{
  const key = event.target.dataset.filter;
  if (!key) return;
  state[key]=event.target.value;
  render();
  content.querySelector(`[data-filter="${key}"]`).focus();
});
content.addEventListener('input',event=>{
  if (event.target.id!=='coverage') return;
  state.coverage=Number(event.target.value);
  updateModel();
});
content.addEventListener('pointermove',event=>{
  const mark=event.target.closest('[data-tip]');
  if (mark) showTip(mark,event.clientX,event.clientY);
  else hideTip();
});
content.addEventListener('pointerleave',hideTip);
content.addEventListener('focusin',event=>{
  if (!event.target.matches('[data-tip]')) return;
  const bounds=event.target.getBoundingClientRect();
  showTip(event.target,bounds.left+bounds.width/2,bounds.bottom);
});
content.addEventListener('focusout',hideTip);
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTip();});
render();
</script>
</body>
</html>
